<div class="mx-auto max-w-2xl rounded-lg bg-white p-8 shadow">

    <h1 class="mb-6 text-3xl font-bold">
        Product Form
    </h1>

    <div class="mb-4">
        <label class="mb-2 block">Name</label>

        <input
            [(ngModel)]="product.name"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">SKU</label>

        <input
            [(ngModel)]="product.sku"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Category</label>

        <input
            [(ngModel)]="product.category"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Quantity</label>

        <input
            [(ngModel)]="product.quantity"
            type="number"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Rack Location</label>

        <input
            [(ngModel)]="product.rackLocation"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-6">
        <label class="mb-2 block">Description</label>

        <textarea
            [(ngModel)]="product.description"
            rows="4"
            class="w-full rounded border p-3">
        </textarea>
    </div>

    <button 
        (click)="submitButton()"
        class="rounded bg-blue-700 px-5 py-3 text-white">

        Save Product

    </button>

</div>
