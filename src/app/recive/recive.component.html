<div class="mx-auto max-w-2xl rounded-lg bg-white p-8 shadow">

    <h1 class="mb-6 text-3xl font-bold">
        Receive Material
    </h1>

    <div class="mb-4">
        <label class="mb-2 block">Product Name</label>

        <input
            [(ngModel)]="receiveData.productName"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">SKU</label>

        <input
            [(ngModel)]="receiveData.sku"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Quantity</label>

        <input
            [(ngModel)]="receiveData.quantity"
            type="number"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Supplier</label>

        <input
            [(ngModel)]="receiveData.supplier"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Rack Location</label>

        <input
            [(ngModel)]="receiveData.rackLocation"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-6">
        <label class="mb-2 block">Date</label>

        <input
            [(ngModel)]="receiveData.date"
            type="date"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-6">
        <label class="mb-2 block">Remark</label>

        <input
            [(ngModel)]="receiveData.remark"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <button
        (click)="receiveProduct()"
        class="rounded bg-green-600 px-5 py-3 text-white">

        Receive Product

    </button>

</div>
