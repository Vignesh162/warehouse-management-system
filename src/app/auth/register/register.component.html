<div class="flex min-h-screen items-center justify-center bg-slate-100">
    <div class="w-[420px] rounded-lg bg-white p-8 shadow-lg">
        <h1 class="mb-6 text-center text-3xl font-bold">
            Create Account
        </h1>
        <div class="mb-4">
            <label class="mb-2 block">Full Name</label>
            <input
                [(ngModel)]="registerData.name"
                name="name"
                type="text"
                class="w-full rounded border p-3">
            </div>
            <div class="mb-4">
                <label class="mb-2 block">Username</label>
                <input
                [(ngModel)]="registerData.username"
                name="username"
                type="text"
                class="w-full rounded border p-3">
            </div>
            <div class="mb-4">
                <label class="mb-2 block">Password</label>
                <input
                [(ngModel)]="registerData.password"
                name="password"
                type="password"
                class="w-full rounded border p-3">
            </div>
 
        <button
            (click)="register()"
            class="w-full rounded bg-blue-700 p-3 text-white">Register</button>

    </div>
</div>
