<div class="mx-auto max-w-2xl rounded-lg bg-white p-8 shadow">

    <h1 class="mb-6 text-3xl font-bold">
        Issue Material
    </h1>

    <div class="mb-4">
        <label class="mb-2 block">Product Name</label>

        <input
            [(ngModel)]="issueData.productName"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">SKU</label>

        <input
            [(ngModel)]="issueData.sku"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Quantity</label>

        <input
            [(ngModel)]="issueData.quantity"
            type="number"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Department</label>

        <input
            [(ngModel)]="issueData.department"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-4">
        <label class="mb-2 block">Rack Location</label>

        <input
            [(ngModel)]="issueData.rackLocation"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-6">
        <label class="mb-2 block">Date</label>

        <input
            [(ngModel)]="issueData.date"
            type="date"
            class="w-full rounded border p-3">
    </div>

    <div class="mb-6">
        <label class="mb-2 block">Remark</label>

        <input
            [(ngModel)]="issueData.date"
            type="text"
            class="w-full rounded border p-3">
    </div>

    <button
        (click)="issueProduct()"
        class="rounded bg-red-600 px-5 py-3 text-white">

        Issue Product

    </button>

</div>
